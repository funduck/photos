name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /Users/oleg/Immitch/library:/data # Assets are stored separately on host
      - /Volumes/EXTDATA/Oleg/Photos:/mnt/media/library:ro # Main library is stored in external drive # TODO remove :ro
    environment:
      TZ: Asia/Tbilisi
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - 2283:2283
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false
    user: "503:20"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW

  immich-machine-learning:
    container_name: immich_machine_learning
    # No hardware acceleration on macOS/Docker Desktop — plain CPU image
    image: ghcr.io/immich-app/immich-machine-learning:v3
    volumes:
      - /Users/oleg/Immitch/ml-model-cache:/cache
    restart: unless-stopped
    healthcheck:
      disable: false
    user: "503:20"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    volumes:
      - /Users/oleg/Immitch/redis:/data
    restart: unless-stopped
    user: "503:20"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
      DB_STORAGE_TYPE: SSD
    volumes:
      - /Users/oleg/Immitch/postgres-data:/var/lib/postgresql/data
    user: "503:20"
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      disable: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
