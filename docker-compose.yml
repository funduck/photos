name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - $IMMICH_DIR/library:/data # Assets are stored separately on host
      - $STORAGE_DIR/Photos:/mnt/media/library # Main library is stored in external drive # TODO remove :ro
    environment:
      TZ: Asia/Tbilisi
      DB_PASSWORD: ${DB_PASSWORD}
    expose:
      - 2283
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false
    user: "503:20"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW

  immich-machine-learning:
    container_name: immich_machine_learning
    # No hardware acceleration on macOS/Docker Desktop — plain CPU image
    image: ghcr.io/immich-app/immich-machine-learning:v3
    volumes:
      - $IMMICH_DIR/ml-model-cache:/cache
    restart: unless-stopped
    healthcheck:
      disable: false
    user: "503:20"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    volumes:
      - $IMMICH_DIR/redis:/data
    restart: unless-stopped
    user: "503:20"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
      DB_STORAGE_TYPE: SSD
    volumes:
      - $IMMICH_DIR/postgres-data:/var/lib/postgresql/data
    user: "503:20"
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      disable: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW

  syncthing:
    container_name: syncthing
    image: syncthing/syncthing:latest
    environment:
      - PUID=503
      - PGID=20
    volumes:
      - $IMMICH_DIR/syncthing-config:/var/syncthing/config
      - $STORAGE_DIR/Test:/var/syncthing/Test
      - $STORAGE_DIR/Photos:/var/syncthing/Photos
    user: "503:20"
    ports:
      - "8385:8384"
      - "22001:22000/tcp"
      - "22001:22000/udp"
    restart: unless-stopped

  rclone-s3-sync:
    container_name: rclone_s3_sync
    build: ./docker/rclone-s3-sync
    environment:
      TZ: Asia/Tbilisi
      RCLONE_REMOTE: ${RCLONE_REMOTE}
      RCLONE_ACCESS_KEY: ${RCLONE_ACCESS_KEY}
      RCLONE_SECRET_ACCESS_KEY: ${RCLONE_SECRET_ACCESS_KEY}
      AWS_BUCKET: ${AWS_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SYNC_NAME: ${RCLONE_SYNC_SUBDIR:-Photos}
      SYNC_INTERVAL: ${RCLONE_SYNC_INTERVAL:-24h}
      DRY_RUN: ${RCLONE_SYNC_DRY_RUN:-true}
    volumes:
      - $STORAGE_DIR/${RCLONE_SYNC_SUBDIR:-Photos}:/data:ro
      - rclone_sync_state:/state
    restart: unless-stopped
    user: "503:20"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW

  caddy:
    container_name: caddy
    image: caddy:2-alpine
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      TZ: Asia/Tbilisi
      IMMICH_DOMAIN: ${IMMICH_DOMAIN}
      IMMICH_EMAIL: ${IMMICH_EMAIL}
    ports:
      - 80:80
      - 443:443
    depends_on:
      - immich-server
    restart: unless-stopped
    user: "503:20"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    cap_add:
      - NET_BIND_SERVICE

volumes:
  rclone_sync_state:
  caddy_data:
  caddy_config:
